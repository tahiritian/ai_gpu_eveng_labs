hostname R4
!
ip routing
!
interface Loopback0
   ip address 10.255.0.4/32
!
interface Ethernet1
   description SB-08 to R3 Ethernet2
   no switchport
   ip address 10.0.34.1/31
!
interface Ethernet2
   description SB-11 to R5 Ethernet1
   no switchport
   ip address 10.0.45.0/31
!
interface Ethernet3
   description SB-03 to R1 Ethernet3
   no switchport
   ip address 10.0.14.1/31
!
interface Ethernet4
   description SB-12 to R7 Ethernet3
   no switchport
   ip address 10.0.47.0/31
!
router bgp 65004
   router-id 10.255.0.4
   maximum-paths 8
   bgp bestpath as-path multipath-relax
   neighbor 10.0.34.0 remote-as 65003
   neighbor 10.0.34.0 description R3
   neighbor 10.0.45.1 remote-as 65005
   neighbor 10.0.45.1 description R5
   neighbor 10.0.14.0 remote-as 65001
   neighbor 10.0.14.0 description R1
   neighbor 10.0.47.1 remote-as 65007
   neighbor 10.0.47.1 description R7
   network 10.255.0.4/32
!
end
