hostname R5
!
ip routing
!
interface Loopback0
   ip address 10.255.0.5/32
!
interface Ethernet1
   description SB-11 to R4 Ethernet2
   no switchport
   ip address 10.0.45.1/31
!
interface Ethernet2
   description SB-13 to R6 Ethernet1
   no switchport
   ip address 10.0.56.0/31
!
interface Ethernet3
   description SB-06 to R2 Ethernet3
   no switchport
   ip address 10.0.25.1/31
!
interface Ethernet4
   description SB-14 to R8 Ethernet3
   no switchport
   ip address 10.0.58.0/31
!
router bgp 65005
   router-id 10.255.0.5
   maximum-paths 8
   bgp bestpath as-path multipath-relax
   neighbor 10.0.45.0 remote-as 65004
   neighbor 10.0.45.0 description R4
   neighbor 10.0.56.1 remote-as 65006
   neighbor 10.0.56.1 description R6
   neighbor 10.0.25.0 remote-as 65002
   neighbor 10.0.25.0 description R2
   neighbor 10.0.58.1 remote-as 65008
   neighbor 10.0.58.1 description R8
   network 10.255.0.5/32
!
end
