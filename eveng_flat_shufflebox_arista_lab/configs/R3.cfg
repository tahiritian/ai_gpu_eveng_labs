hostname R3
!
ip routing
!
interface Loopback0
   ip address 10.255.0.3/32
!
interface Ethernet1
   description SB-05 to R2 Ethernet2
   no switchport
   ip address 10.0.23.1/31
!
interface Ethernet2
   description SB-08 to R4 Ethernet1
   no switchport
   ip address 10.0.34.0/31
!
interface Ethernet3
   description SB-09 to R6 Ethernet3
   no switchport
   ip address 10.0.36.0/31
!
interface Ethernet4
   description SB-10 to R8 Ethernet4
   no switchport
   ip address 10.0.38.0/31
!
interface Ethernet5
   description HOST-03 to H3 eth0
   no switchport
   ip address 10.3.3.1/24
!
router bgp 65003
   router-id 10.255.0.3
   maximum-paths 8
   bgp bestpath as-path multipath-relax
   neighbor 10.0.23.0 remote-as 65002
   neighbor 10.0.23.0 description R2
   neighbor 10.0.34.1 remote-as 65004
   neighbor 10.0.34.1 description R4
   neighbor 10.0.36.1 remote-as 65006
   neighbor 10.0.36.1 description R6
   neighbor 10.0.38.1 remote-as 65008
   neighbor 10.0.38.1 description R8
   network 10.255.0.3/32
   network 10.3.3.0/24
!
end
