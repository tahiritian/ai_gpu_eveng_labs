hostname R1
!
ip routing
!
interface Loopback0
   ip address 10.255.0.1/32
!
interface Ethernet1
   description SB-01 to R2 Ethernet1
   no switchport
   ip address 10.0.12.0/31
!
interface Ethernet2
   description SB-02 to R8 Ethernet2
   no switchport
   ip address 10.0.18.0/31
!
interface Ethernet3
   description SB-03 to R4 Ethernet3
   no switchport
   ip address 10.0.14.0/31
!
interface Ethernet4
   description SB-04 to R6 Ethernet4
   no switchport
   ip address 10.0.16.0/31
!
interface Ethernet5
   description HOST-01 to H1 eth0
   no switchport
   ip address 10.1.1.1/24
!
router bgp 65001
   router-id 10.255.0.1
   maximum-paths 8
   bgp bestpath as-path multipath-relax
   neighbor 10.0.12.1 remote-as 65002
   neighbor 10.0.12.1 description R2
   neighbor 10.0.18.1 remote-as 65008
   neighbor 10.0.18.1 description R8
   neighbor 10.0.14.1 remote-as 65004
   neighbor 10.0.14.1 description R4
   neighbor 10.0.16.1 remote-as 65006
   neighbor 10.0.16.1 description R6
   network 10.255.0.1/32
   network 10.1.1.0/24
!
end
