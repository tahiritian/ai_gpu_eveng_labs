hostname R6
!
ip routing
!
interface Loopback0
   ip address 10.255.0.6/32
!
interface Ethernet1
   description SB-13 to R5 Ethernet2
   no switchport
   ip address 10.0.56.1/31
!
interface Ethernet2
   description SB-15 to R7 Ethernet1
   no switchport
   ip address 10.0.67.0/31
!
interface Ethernet3
   description SB-09 to R3 Ethernet3
   no switchport
   ip address 10.0.36.1/31
!
interface Ethernet4
   description SB-04 to R1 Ethernet4
   no switchport
   ip address 10.0.16.1/31
!
interface Ethernet5
   description HOST-06 to H6 eth0
   no switchport
   ip address 10.6.6.1/24
!
router bgp 65006
   router-id 10.255.0.6
   maximum-paths 8
   bgp bestpath as-path multipath-relax
   neighbor 10.0.56.0 remote-as 65005
   neighbor 10.0.56.0 description R5
   neighbor 10.0.67.1 remote-as 65007
   neighbor 10.0.67.1 description R7
   neighbor 10.0.36.0 remote-as 65003
   neighbor 10.0.36.0 description R3
   neighbor 10.0.16.0 remote-as 65001
   neighbor 10.0.16.0 description R1
   network 10.255.0.6/32
   network 10.6.6.0/24
!
end
