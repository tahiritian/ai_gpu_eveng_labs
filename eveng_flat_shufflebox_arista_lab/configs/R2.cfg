hostname R2
!
ip routing
!
interface Loopback0
   ip address 10.255.0.2/32
!
interface Ethernet1
   description SB-01 to R1 Ethernet1
   no switchport
   ip address 10.0.12.1/31
!
interface Ethernet2
   description SB-05 to R3 Ethernet1
   no switchport
   ip address 10.0.23.0/31
!
interface Ethernet3
   description SB-06 to R5 Ethernet3
   no switchport
   ip address 10.0.25.0/31
!
interface Ethernet4
   description SB-07 to R7 Ethernet4
   no switchport
   ip address 10.0.27.0/31
!
router bgp 65002
   router-id 10.255.0.2
   maximum-paths 8
   bgp bestpath as-path multipath-relax
   neighbor 10.0.12.0 remote-as 65001
   neighbor 10.0.12.0 description R1
   neighbor 10.0.23.1 remote-as 65003
   neighbor 10.0.23.1 description R3
   neighbor 10.0.25.1 remote-as 65005
   neighbor 10.0.25.1 description R5
   neighbor 10.0.27.1 remote-as 65007
   neighbor 10.0.27.1 description R7
   network 10.255.0.2/32
!
end
