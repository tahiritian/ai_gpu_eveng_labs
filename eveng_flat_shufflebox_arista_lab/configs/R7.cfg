hostname R7
!
ip routing
!
interface Loopback0
   ip address 10.255.0.7/32
!
interface Ethernet1
   description SB-15 to R6 Ethernet2
   no switchport
   ip address 10.0.67.1/31
!
interface Ethernet2
   description SB-16 to R8 Ethernet1
   no switchport
   ip address 10.0.78.0/31
!
interface Ethernet3
   description SB-12 to R4 Ethernet4
   no switchport
   ip address 10.0.47.1/31
!
interface Ethernet4
   description SB-07 to R2 Ethernet4
   no switchport
   ip address 10.0.27.1/31
!
router bgp 65007
   router-id 10.255.0.7
   maximum-paths 8
   bgp bestpath as-path multipath-relax
   neighbor 10.0.67.0 remote-as 65006
   neighbor 10.0.67.0 description R6
   neighbor 10.0.78.1 remote-as 65008
   neighbor 10.0.78.1 description R8
   neighbor 10.0.47.0 remote-as 65004
   neighbor 10.0.47.0 description R4
   neighbor 10.0.27.0 remote-as 65002
   neighbor 10.0.27.0 description R2
   network 10.255.0.7/32
!
end
