hostname R8
!
ip routing
!
interface Loopback0
   ip address 10.255.0.8/32
!
interface Ethernet1
   description SB-16 to R7 Ethernet2
   no switchport
   ip address 10.0.78.1/31
!
interface Ethernet2
   description SB-02 to R1 Ethernet2
   no switchport
   ip address 10.0.18.1/31
!
interface Ethernet3
   description SB-14 to R5 Ethernet4
   no switchport
   ip address 10.0.58.1/31
!
interface Ethernet4
   description SB-10 to R3 Ethernet4
   no switchport
   ip address 10.0.38.1/31
!
interface Ethernet5
   description HOST-08 to H8 eth0
   no switchport
   ip address 10.8.8.1/24
!
router bgp 65008
   router-id 10.255.0.8
   maximum-paths 8
   bgp bestpath as-path multipath-relax
   neighbor 10.0.78.0 remote-as 65007
   neighbor 10.0.78.0 description R7
   neighbor 10.0.18.0 remote-as 65001
   neighbor 10.0.18.0 description R1
   neighbor 10.0.58.0 remote-as 65005
   neighbor 10.0.58.0 description R5
   neighbor 10.0.38.0 remote-as 65003
   neighbor 10.0.38.0 description R3
   network 10.255.0.8/32
   network 10.8.8.0/24
!
end
