        hostname PE2
        service routing protocols model multi-agent
        ip routing
        ipv6 unicast-routing
        ip virtual-router mac-address 00:1c:73:00:10:99
        !

interface Loopback0
   ip address 10.255.200.2/32
interface Ethernet1
   no switchport
   ip address 198.51.100.3/31
interface Ethernet2
   no switchport
   ip address 198.51.100.5/31
interface Ethernet3
   no switchport
   ip address 198.51.100.6/31
!
router bgp 65302
   router-id 10.255.200.2
   neighbor 198.51.100.2 remote-as 65000
   neighbor 198.51.100.4 remote-as 65301
   neighbor 198.51.100.7 remote-as 65400
   address-family ipv4
      neighbor 198.51.100.2 activate
      neighbor 198.51.100.4 activate
      neighbor 198.51.100.7 activate
!
        end
