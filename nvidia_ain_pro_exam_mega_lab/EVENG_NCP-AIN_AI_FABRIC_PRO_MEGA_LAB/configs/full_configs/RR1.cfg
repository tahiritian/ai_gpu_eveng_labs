        hostname RR1
        service routing protocols model multi-agent
        ip routing
        ipv6 unicast-routing
        ip virtual-router mac-address 00:1c:73:00:10:99
        !

interface Loopback0
   ip address 10.255.255.11/32
   ipv6 address 2001:db8:ffff:11::11/128
interface Ethernet1
   no switchport
   ip address 10.0.100.1/31
   ip ospf area 0.0.0.0
interface Ethernet2
   no switchport
   ip address 10.0.100.3/31
   ip ospf area 0.0.0.0
!
router ospf 100
   router-id 10.255.255.11
   passive-interface default
   no passive-interface Ethernet1
   no passive-interface Ethernet2
   network 10.255.255.11/32 area 0.0.0.0
!
router bgp 65000
   router-id 10.255.255.11
   neighbor FABRIC peer group
   neighbor FABRIC remote-as 65000
   neighbor FABRIC update-source Loopback0
   neighbor FABRIC send-community extended
   neighbor 10.255.0.1 peer group FABRIC
   neighbor 10.255.0.2 peer group FABRIC
   neighbor 10.255.0.3 peer group FABRIC
   neighbor 10.255.0.4 peer group FABRIC
   neighbor 10.255.0.11 peer group FABRIC
   neighbor 10.255.0.12 peer group FABRIC
   address-family evpn
      neighbor FABRIC activate
      neighbor FABRIC route-reflector-client
      neighbor FABRIC next-hop-unchanged
!
        end
