        hostname REMOTE-DC
        service routing protocols model multi-agent
        ip routing
        ipv6 unicast-routing
        ip virtual-router mac-address 00:1c:73:00:10:99
        !

interface Loopback0
   ip address 10.255.210.1/32
interface Loopback100
   ip address 203.0.113.10/32
interface Ethernet1
   no switchport
   ip address 198.51.100.7/31
!
ip route 203.0.113.0/24 Null0
!
router bgp 65400
   router-id 10.255.210.1
   neighbor 198.51.100.6 remote-as 65302
   address-family ipv4
      neighbor 198.51.100.6 activate
   network 203.0.113.0/24
   network 203.0.113.10/32
!
        end
