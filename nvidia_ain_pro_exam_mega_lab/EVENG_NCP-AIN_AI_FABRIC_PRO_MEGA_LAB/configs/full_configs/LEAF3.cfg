        hostname LEAF3
        service routing protocols model multi-agent
        ip routing
        ipv6 unicast-routing
        ip virtual-router mac-address 00:1c:73:00:10:99
        !

vlan 110
   name AI_GPU_TRAIN
vlan 120
   name AI_STORAGE
vlan 130
   name AI_SERVICES
vlan 210
   name TENANT_B_DEV
vlan 4094
   name MLAG_PEER
!
vrf instance AI_FABRIC
vrf instance AI_SERVICES
vrf instance TENANT_B
!
ip routing vrf AI_FABRIC
ip routing vrf AI_SERVICES
ip routing vrf TENANT_B
!
interface Loopback0
   ip address 10.255.0.3/32
   ipv6 address 2001:db8:ffff:3::3/128
interface Loopback1
   ip address 10.254.0.3/32
   ipv6 address 2001:db8:vtep::3/128
interface Loopback2
   ip address 10.254.34.34/32
   ipv6 address 2001:db8:vvtep::34/128
!
interface Ethernet1
   no switchport
   ip address 10.0.0.4/31
   ip ospf area 0.0.0.0
   mtu 9214
interface Ethernet2
   no switchport
   ip address 10.0.0.16/31
   ip ospf area 0.0.0.0
   mtu 9214
interface Ethernet10
   channel-group 100 mode active
interface Ethernet11
   channel-group 100 mode active
interface Port-Channel100
   switchport mode trunk
   switchport trunk allowed vlan 110,120,130,210,4094
interface Vlan4094
   ip address 10.255.34.1/30
   no autostate
mlag configuration
   domain-id POD2
   local-interface Vlan4094
   peer-address 10.255.34.2
   peer-link Port-Channel100
!
interface Ethernet20
   channel-group 20 mode active
interface Port-Channel20
   switchport access vlan 110
   switchport mode access
   spanning-tree portfast
   mlag 20
interface Ethernet21
   channel-group 21 mode active
interface Port-Channel21
   switchport access vlan 120
   switchport mode access
   spanning-tree portfast
   mlag 21
!
interface Vlan110
   vrf AI_FABRIC
   ip address virtual 172.16.110.1/24
   ipv6 address virtual 2001:db8:110::1/64
interface Vlan120
   vrf AI_FABRIC
   ip address virtual 172.16.120.1/24
   ipv6 address virtual 2001:db8:120::1/64
interface Vlan130
   vrf AI_SERVICES
   ip address virtual 172.16.130.1/24
   ipv6 address virtual 2001:db8:130::1/64
interface Vlan210
   vrf TENANT_B
   ip address virtual 172.16.210.1/24
   ipv6 address virtual 2001:db8:210::1/64
!
interface Vxlan1
   vxlan source-interface Loopback1
   vxlan udp-port 4789
   vxlan vlan 110 vni 10110
   vxlan vlan 120 vni 10120
   vxlan vlan 130 vni 10130
   vxlan vlan 210 vni 10210
   vxlan vrf AI_FABRIC vni 50110
   vxlan vrf AI_SERVICES vni 50130
   vxlan vrf TENANT_B vni 50210
   vxlan virtual-vtep local-interface Loopback2
!
router ospf 100
   router-id 10.255.0.3
   passive-interface default
   no passive-interface Ethernet1
   no passive-interface Ethernet2
   network 10.255.0.3/32 area 0.0.0.0
   network 10.254.0.3/32 area 0.0.0.0
   network 10.254.34.34/32 area 0.0.0.0
!
router bgp 65000
   router-id 10.255.0.3
   maximum-paths 8 ecmp 8
   neighbor RR peer group
   neighbor RR remote-as 65000
   neighbor RR update-source Loopback0
   neighbor RR send-community extended
   neighbor 10.255.255.11 peer group RR
   neighbor 10.255.255.12 peer group RR
   address-family evpn
      neighbor RR activate
   vlan 110
      rd 10.255.0.3:10110
      route-target both 10110:10110
      redistribute learned
   vlan 120
      rd 10.255.0.3:10120
      route-target both 10120:10120
      redistribute learned
   vlan 130
      rd 10.255.0.3:10130
      route-target both 10130:10130
      redistribute learned
   vlan 210
      rd 10.255.0.3:10210
      route-target both 10210:10210
      redistribute learned
   vrf AI_FABRIC
      rd 10.255.0.3:50110
      route-target import evpn 50110:50110
      route-target export evpn 50110:50110
      redistribute connected
   vrf AI_SERVICES
      rd 10.255.0.3:50130
      route-target import evpn 50130:50130
      route-target export evpn 50130:50130
      redistribute connected
   vrf TENANT_B
      rd 10.255.0.3:50210
      route-target import evpn 50210:50210
      route-target export evpn 50210:50210
      redistribute connected
!
        end
