        hostname PE1
        service routing protocols model multi-agent
        ip routing
        ipv6 unicast-routing
        ip virtual-router mac-address 00:1c:73:00:10:99
        !

interface Loopback0
   ip address 10.255.200.1/32
interface Ethernet1
   no switchport
   ip address 198.51.100.1/31
interface Ethernet2
   no switchport
   ip address 198.51.100.4/31
!
router bgp 65301
   router-id 10.255.200.1
   neighbor 198.51.100.0 remote-as 65000
   neighbor 198.51.100.5 remote-as 65302
   address-family ipv4
      neighbor 198.51.100.0 activate
      neighbor 198.51.100.5 activate
!
        end
