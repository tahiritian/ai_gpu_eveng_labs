frr version 8
service integrated-vtysh-config
hostname BL1
!
router ospf
 ospf router-id 10.255.0.11
 passive-interface default
 no passive-interface swp1
 no passive-interface swp2
 network 10.255.0.11/32 area 0.0.0.0
 network 10.254.0.11/32 area 0.0.0.0
 network 10.254.78.78/32 area 0.0.0.0
!
router bgp 65000
 bgp router-id 10.255.0.11
 neighbor RR peer-group
 neighbor RR remote-as 65000
 neighbor 10.255.255.11 peer-group RR
 neighbor 10.255.255.12 peer-group RR
 neighbor 198.51.100.1 remote-as 65301
 network 100.64.10.11/32
 !
 address-family ipv4 unicast
  neighbor 198.51.100.1 activate
 exit-address-family
 !
 address-family l2vpn evpn
  neighbor RR activate
  advertise-all-vni
  advertise-svi-ip
 exit-address-family
!
line vty
