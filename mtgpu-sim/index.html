<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy"
          content="default-src 'self';
                   script-src 'self';
                   style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
                   font-src 'self' https://fonts.gstatic.com;
                   connect-src 'self' https://*.amazonaws.com https://*.amazoncognito.com;
                   img-src 'self' data:;
                   frame-ancestors 'none'" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content" />

    <title>MTGPU-Sim</title>
    <meta name="description" content="MTGPU-Sim: a browser-based GPU cluster lab." />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#0B0F1A" />
    <link rel="icon" type="image/svg+xml" href="/mtgpu-icon.svg" />

    <!-- Monospace fonts for terminal (non-render-blocking) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preload" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" as="style">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
    <noscript><link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet"></noscript>

    <!-- DNS prefetch for AWS services -->
    <link rel="dns-prefetch" href="https://cognito-idp.us-east-1.amazonaws.com">
    <link rel="dns-prefetch" href="https://cognito-identity.us-east-1.amazonaws.com">
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <div style="padding:2rem;font-family:system-ui,sans-serif;color:#E9EDF5;background:#0B0F1A;min-height:100vh;">
        MTGPU-Sim requires JavaScript.
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
